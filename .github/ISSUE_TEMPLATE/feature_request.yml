name: 功能建议
description: 提议一个新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 先说遇到的痛点，而不是想要的方案
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
