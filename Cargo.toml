[workspace]
resolver = "2"
members = [
    "crates/gamelift-core",
    "crates/gamelift-launchers",
    "crates/gamelift-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/Spkicn/game-lan-transfer"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
