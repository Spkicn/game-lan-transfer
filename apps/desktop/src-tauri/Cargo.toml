[package]
name = "gamelift-desktop"
description = "GameLift 桌面应用：Tauri 壳，只写命令胶水层"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 生产构建：内嵌前端产物，不再连 dev server；tauri build 会自动启用
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gamelift-core = { path = "../../../crates/gamelift-core" }
gamelift-launchers = { path = "../../../crates/gamelift-launchers" }

[lints]
workspace = true
